# Local PostgreSQL 16 for development and tests.
# The superuser below is the *owner* role: it runs migrations and owns tables.
# The application connects as `kit_app`, created by the first migration.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kit_owner
      POSTGRES_PASSWORD: kit_owner_local
      POSTGRES_DB: kit
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit_owner -d kit"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kit_pg:/var/lib/postgresql/data

volumes:
  kit_pg:
