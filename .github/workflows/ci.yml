name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kit_owner
          POSTGRES_PASSWORD: kit_owner_local
          POSTGRES_DB: kit
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U kit_owner -d kit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KIT_REQUIRE_PG: "1"  # database tests must run here, never skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
